<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KINETix Electric Lime - The ultimate energy drink for athletes and professionals.">
    <title>KINETix | Electric Lime</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Defer ensures the JS loads after the HTML is parsed -->
    <script src="script.js" defer></script> 
</head>
<body>
    <header class="site-header">
        <h1>KINETix</h1>
    </header>

    <main class="hero-section">
        <div class="hero-image">
            <!-- Using a placeholder for your local image -->
            <img src="https://images.unsplash.com/photo-1622543925917-763c34d1a86e?auto=format&fit=crop&w=600&q=80" 
                 alt="A sleek can of KINETix Electric Lime energy drink covered in condensation">
        </div>
        
        <div class="hero-content">
            <h2>Kinetix Electric <span class="highlight">Lime</span></h2>
            
            <p>Kinetix Electric is appreciated worldwide by top athletes, busy professionals, university students, and travelers on long journeys.</p>
            
            <table class="nutrition-table">
                <caption>Nutritional Information per serving</caption>
                <thead>
                    <tr>
                        <th scope="col">Ingredients</th>
                        <th scope="col">Calories</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Caffeine</td>
                        <td>23 kCal</td>
                    </tr>
                    <tr>
                        <td>Taurine</td>
                        <td>10 kCal</td>
                    </tr>
                </tbody>
            </table>
            
            <button id="orderBtn" class="btn-primary" aria-label="Order Kinetix Electric Lime now">
                Order Now
            </button>
        </div>
    </main>

    <!-- Accessible live region for screen readers to announce the order confirmation -->
    <div id="toastNotification" class="toast hidden" aria-live="polite"></div>
</body>
</html>
